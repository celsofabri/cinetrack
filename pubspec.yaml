name: cinetrack
description: "Favorite movies and TV shows, track episode-by-episode progress."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.1
  go_router: ^14.2.0
  flutter_dotenv: ^6.0.1
  cached_network_image: ^3.3.1
  intl: ^0.20.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  web: ^1.1.1
  unorm_dart: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/splash_logo.png
    - assets/tmdb_logo.png
