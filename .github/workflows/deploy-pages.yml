name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # pubspec declares .env as an asset and the file is gitignored, so
      # analyze/test run with a dummy one (tests never need the real key).
      - name: Create dummy .env for analyze/test
        run: printf 'TMDB_API_KEY=test\n' > .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Overwrite with the real key only right before the build.
      # The value is never echoed.
      - name: Create .env from secret
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Secret TMDB_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          printf 'TMDB_API_KEY=%s\n' "$TMDB_API_KEY" > .env

      - name: Build web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare Pages artifact
        run: |
          # SPA fallback for deep links (go_router)
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
