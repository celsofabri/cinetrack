name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # Publishing the placeholder would ship an app that cannot save anything
      # (no Firebase). Only inspects the file for the marker; prints no secrets.
      - name: Ensure Firebase is configured
        run: |
          if grep -q "PLACEHOLDER" lib/firebase_options.dart; then
            echo "::error file=lib/firebase_options.dart::Firebase is not configured: lib/firebase_options.dart is still the placeholder. Run 'flutterfire configure' and commit the generated file before deploying (see README)."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      # pubspec declares .env as an asset and the file is gitignored, so
      # analyze/test/build run with a dummy one (the real key comes via --dart-define).
      - name: Create dummy .env for analyze/test
        run: printf 'TMDB_API_KEY=test\n' > .env

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # GitHub Pages drops dotfiles, so the key is compiled in with
      # --dart-define instead of shipped as the .env asset. Never echoed.
      - name: Build web
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Secret TMDB_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          flutter build web --release --base-href "/${REPO_NAME}/" --dart-define=TMDB_API_KEY="$TMDB_API_KEY"

      - name: Prepare Pages artifact
        run: |
          # SPA fallback for deep links (go_router)
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
